<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Календарь</title>
    <style>
        body {
            margin: 0;
            padding: 0;
        }
        nav{
            display: flex;
            position: fixed;
            justify-content: space-between;
            background-color: brown;
            align-items: center;
            box-sizing: border-box;
            height: 15vh;
            bottom: 0px;
            margin-left: 0px;
            width: 100%;
            z-index: 10;
        }
        .navbutton{
            flex: 1;
            width: 100%;
            height: 100%;
            text-align: center;
        }
        #content {
            padding: 20px;
            margin-bottom: 16vh;
        }
        #monthHeader {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #calendarGrid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-top: 10px;
        }
        .calendar-cell {
            border: 1px solid black;
            min-height: 60px;
            padding: 4px;
            box-sizing: border-box;
            font-size: 14px;
            cursor: pointer;
        }
        .calendar-cell.empty {
            border: none;
            cursor: default;
        }
        .calendar-cell.today {
            outline: 3px solid blue;
            background-color: #cce0ff;
        }
        .calendar-cell.has-reminder {
            background-color: #ffb3b3;
        }
        .calendar-cell.today.has-reminder {
            background-color: #ffb3b3;
            outline: 3px solid blue;
        }
        #addForm {
            margin-top: 20px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .reminder-item {
            border: 1px solid black;
            padding: 8px;
            margin: 8px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>
    <nav id="nav">
        <button class = "navbutton" id="home" data-url="home.html">дом</button>
        <button class = "navbutton" id="kalendar" data-url="calendar.html">календарь</button>
        <button class = "navbutton" id="cabinet" data-url="cabinet.html">личный каб</button>
    </nav>

    <div id="content">
        <h1>Календарь</h1>

        <div id="monthHeader">
            <button id="prevMonth">←</button>
            <h2 id="monthLabel"></h2>
            <button id="nextMonth">→</button>
        </div>
        <div id="calendarGrid"></div>

        <h2>Добавить напоминание о собеседовании</h2>
        <div id="addForm">
            <input type="text" id="remTitle" placeholder="Например: собеседование в TechStart">
            <input type="date" id="remDate">
            <input type="time" id="remTime">
            <button id="addReminder">Добавить</button>
        </div>

        <h2>Ближайшие собеседования</h2>
        <div id="upcomingList"></div>
    </div>

    <script>
        const REMINDERS_KEY = 'witteens_reminders';

        function loadReminders() {
            try {
                const saved = localStorage.getItem(REMINDERS_KEY);
                if (saved) return JSON.parse(saved);
            } catch (e) {}
            return [];
        }

        function saveReminders() {
            try { localStorage.setItem(REMINDERS_KEY, JSON.stringify(reminders)); } catch (e) {}
        }

        let reminders = loadReminders();

        let viewDate = new Date();
        viewDate.setDate(1);

        const monthNames = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];

        function todayStr() {
            const t = new Date();
            return t.toISOString().slice(0, 10);
        }

        function renderCalendar() {
            const year = viewDate.getFullYear();
            const month = viewDate.getMonth();

            document.getElementById('monthLabel').textContent = `${monthNames[month]} ${year}`;

            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            const firstDay = new Date(year, month, 1);
            let startOffset = (firstDay.getDay() + 6) % 7;
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            const weekDays = ['пн','вт','ср','чт','пт','сб','вс'];
            weekDays.forEach(d => {
                const cell = document.createElement('div');
                cell.textContent = d;
                grid.appendChild(cell);
            });

            for (let i = 0; i < startOffset; i++) {
                const empty = document.createElement('div');
                empty.className = 'calendar-cell empty';
                grid.appendChild(empty);
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const cell = document.createElement('div');
                cell.className = 'calendar-cell';
                if (dateStr === todayStr()) cell.classList.add('today');

                const dayReminders = reminders.filter(r => r.date === dateStr);
                if (dayReminders.length) cell.classList.add('has-reminder');
                cell.textContent = day;
                cell.dataset.date = dateStr;
                grid.appendChild(cell);
            }
        }
        function renderUpcoming() {
            const now = todayStr();
            const upcoming = reminders
                .filter(r => r.date >= now)
                .sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));

            const list = document.getElementById('upcomingList');
            if (upcoming.length === 0) {
                list.innerHTML = '<p>Пока нет запланированных собеседований.</p>';
                return;
            }

            list.innerHTML = upcoming.map(r => `
                <div class="reminder-item">
                    <span><strong>${r.title}</strong><br>${r.date}${r.time ? ' в ' + r.time : ''}</span>
                    <button data-id="${r.id}" class="delete-reminder">удалить</button>
                </div>
            `).join('');
        }

        function renderAll() {
            renderCalendar();
            renderUpcoming();
        }

        renderAll();

        document.getElementById('prevMonth').addEventListener('click', () => {
            viewDate.setMonth(viewDate.getMonth() - 1);
            renderCalendar();
        });
        document.getElementById('nextMonth').addEventListener('click', () => {
            viewDate.setMonth(viewDate.getMonth() + 1);
            renderCalendar();
        });

        document.getElementById('addReminder').addEventListener('click', () => {
            const title = document.getElementById('remTitle').value.trim();
            const date = document.getElementById('remDate').value;
            const time = document.getElementById('remTime').value;

            if (!title || !date) {
                alert('Укажи хотя бы название и дату');
                return;
            }

            reminders.push({ id: 'r' + Date.now(), title, date, time });
            saveReminders();

            document.getElementById('remTitle').value = '';
            document.getElementById('remDate').value = '';
            document.getElementById('remTime').value = '';

            renderAll();
        });

        function clickoko(document){
            document.addEventListener('click', (event) => {
                const navBtn = event.target.closest('button[data-url]');
                if (navBtn) {
                    window.location.href = navBtn.dataset.url;
                    return;
                }
                const delBtn = event.target.closest('.delete-reminder');
                if (delBtn) {
                    reminders = reminders.filter(r => r.id !== delBtn.dataset.id);
                    saveReminders();
                    renderAll();
                    return;
                }
                const dayCell = event.target.closest('.calendar-cell:not(.empty)');
                if (dayCell) {
                    document.getElementById('remDate').value = dayCell.dataset.date;
                    document.getElementById('remTitle').focus();
                }
            })
        }

        clickoko(document);
    </script>
</body>
</html>
